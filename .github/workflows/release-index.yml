name: Release polar bear index

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and verify the tagged page
        run: python3 index/build-release.py --tag "$GITHUB_REF_NAME"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_dir="releases/$version"
          flags=()
          if [[ "$version" == *-* ]]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$release_dir/polar-bear-index-v$version.zip" \
            "$release_dir/SHA256SUMS.txt" \
            "$release_dir/release.json" \
            --verify-tag --title "北极熊单页 v$version" \
            --notes-file "$release_dir/release-notes.md" \
            "${flags[@]}"
