<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061923">
  <meta name="description" content="北极熊 · 世界的另一面。此域名不支持直接访问">
  <title>北极熊 · 世界的另一面</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #061923;
      --snow: #f0f7f8;
      --ice: #bcebec;
      --muted: #9bb5bf;
      --line: rgb(188 235 236 / 12%);
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --space: clamp(24px, 5vw, 80px);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--night); }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      color: var(--snow);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(ellipse at 50% 40%, rgb(28 71 80 / 32%), transparent 58%),
        radial-gradient(ellipse at 80% 0%, rgb(24 57 72 / 25%), transparent 50%),
        var(--night);
    }
    ::selection { color: var(--night); background: var(--ice); }
    .site-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 32px var(--space);
      padding-top: max(32px, env(safe-area-inset-top));
    }
    .brand { display: flex; align-items: center; gap: 16px; }
    .brand-name { font-size: 16px; font-weight: 600; letter-spacing: .18em; }
    .brand-english {
      padding-left: 16px;
      border-left: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .18em;
    }
    .page-label { color: var(--muted); font-size: 12px; letter-spacing: .08em; }
    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 48px 24px 88px;
    }
    .message { width: min(100%, 720px); text-align: center; }
    .polar-scene {
      display: block;
      width: 216px;
      height: auto;
      margin: 0 auto 24px;
      color: var(--ice);
    }
    h1 {
      margin: 0;
      font-size: clamp(36px, 5vw, 64px);
      font-weight: 500;
      line-height: 1.3;
      letter-spacing: .06em;
      text-wrap: balance;
    }
    .description {
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 1.5vw, 18px);
      line-height: 1.75;
      letter-spacing: .03em;
      text-wrap: pretty;
    }
    .site-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 24px;
      margin: 0 var(--space);
      padding: 16px 0;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
    }
    .footer-brand { color: var(--muted); font-size: 12px; letter-spacing: .06em; }
    .record-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 8px 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.75;
      text-decoration: none;
      text-underline-offset: 4px;
    }
    .external-icon { width: 12px; height: 12px; flex: none; }
    .record-link:hover { color: var(--ice); text-decoration: underline; }
    .record-link:active { color: var(--snow); }
    .record-link:focus-visible { outline: 2px solid var(--ice); outline-offset: 4px; border-radius: 3px; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    @media (prefers-reduced-motion: no-preference) {
      h1 { animation: arrive 650ms cubic-bezier(.2, .7, .2, 1) both; }
      .record-link { transition: color 180ms ease; }
      @keyframes arrive {
        from { opacity: .6; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
    @media (max-width: 480px) {
      .site-header { padding-top: max(24px, env(safe-area-inset-top)); padding-bottom: 24px; }
      .brand { gap: 12px; }
      .brand-english { padding-left: 12px; font-size: 11px; letter-spacing: .1em; }
      main { padding-top: 40px; padding-bottom: 64px; }
      .polar-scene { width: 176px; margin-bottom: 24px; }
      h1 { letter-spacing: .03em; }
      .description { margin-top: 20px; }
      .site-footer { justify-content: center; padding-top: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
      .footer-brand { display: none; }
    }
    @media (max-height: 540px) and (min-width: 481px) {
      .site-header { padding-top: 20px; padding-bottom: 20px; }
      main { padding-top: 16px; padding-bottom: 40px; }
      .polar-scene { width: 136px; margin-bottom: 16px; }
      h1 { font-size: 40px; }
      .description { margin-top: 16px; }
    }
  </style>
</head>
<body>

  </main>
  <footer class="site-footer">
    <span class="footer-brand">北极熊 <span aria-hidden="true">·</span> 世界的另一面</span>
